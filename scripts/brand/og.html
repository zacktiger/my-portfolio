<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#f5f3ee;color:#2a2825;font-family:Geist,sans-serif;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(#e2ddd3 1px,transparent 1px),linear-gradient(90deg,#e2ddd3 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 75% 70% at 30% 40%,#000 20%,transparent 75%);opacity:.7}
.glow{position:absolute;width:900px;height:900px;left:-200px;top:-350px;background:radial-gradient(circle,rgba(214,170,120,.18),transparent 60%)}
.wrap{position:absolute;inset:72px 80px;display:flex;flex-direction:column}
.label{font-family:'Geist Mono',monospace;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:#6b6760;display:flex;align-items:center;gap:16px}
.label:after{content:'';flex:1;height:1px;background:#e2ddd3}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:150px;line-height:.95;letter-spacing:-.035em;color:#171614;margin-top:36px}
h1 i{color:#6b6760}h1 b{color:#d9480f;font-weight:400}
p{margin-top:36px;font-size:30px;line-height:1.35;max-width:820px;text-wrap:balance;color:#2a2825}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-family:'Geist Mono',monospace;font-size:19px;color:#6b6760;border-top:1px solid #e2ddd3;padding-top:22px}
</style></head><body><div class="glow"></div><div class="grid"></div>
<div class="wrap">
<div class="label">Backend-leaning full-stack engineer</div>
<h1>Kshitij <i>Bachhav</i><b>.</b></h1>
<p>I build backend systems and benchmark them before I make claims about them.</p>
<div class="foot"><span>B.Tech ECE · IIIT Nagpur</span><span>github.com/zacktiger</span></div>
</div></body></html>
